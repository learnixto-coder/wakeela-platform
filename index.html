  .flatMap(x => x.cells[fi].info.files.map(f => ({ t: x, c: x.cells[fi], x: f })));
const fileUrl = (c, n) => c.info.url + encodeURIComponent('/' + n.split(' / ').join('/')) + '&parent=' + c.info.url.split('?id=')[1];
const KIND_NOTE = { video: 'مقطع فيديو، يُشغَّل من OneDrive.', office0: 'ملف Word أو PowerPoint أو Excel، تُجهَّز معاينته في التحديث القادم.', none: 'لا تتوفر معاينة لهذا النوع من الملفات.' };

function folders(i) {
  if (i !== undefined && D.folders[i] && i !== fvs.fi) Object.assign(fvs, { fi: i, t: 'all', k: 0, mode: 'grid' });
  const f = D.folders[fvs.fi], files = fvFiles(fvs.fi, fvs.t);
  fvs.k = Math.min(fvs.k, Math.max(0, files.length - 1));
  const cur = files[fvs.k];
  let grp = '';
  const toc = D.folders.map(x => {
    const n = fvFiles(x.i, 'all').length, head = x.group && x.group !== grp ? `<div class="grp">${esc(x.group)}</div>` : '';
    grp = x.group;
    return `${head}<button data-fv="${x.i}" class="${x.i === fvs.fi ? 'on' : ''}"><span class="t">${esc(x.label)}</span><span class="n">${nf(n)}</span></button>`;
  }).join('');
  const who = D.teachers.map(x => ({ x, n: x.cells[fvs.fi].info?.count || 0 })).filter(r => r.n);
  return `<div class="fv">
  <nav class="card fv-toc" aria-label="المجلدات">${toc}</nav>
  <div style="min-width:0">
    <select class="search fv-sel" id="fvF" aria-label="المجلد" style="width:100%">${D.folders.map(x => `<option value="${x.i}"${x.i === fvs.fi ? ' selected' : ''}>${esc((x.group ? x.group + ' / ' : '') + x.label)} (${nf(fvFiles(x.i, 'all').length)})</option>`).join('')}</select>
    <div class="fv-bar">
      <h2>${esc(f.label)}${f.group ? ` <span class="muted" style="font-weight:400;font-size:14px">· ${esc(f.group)}</span>` : ''}</h2>
      <select class="search" id="fvT" aria-label="المعلمة" style="flex:0 1 260px"><option value="all">كل المعلمات (${nf(fvFiles(fvs.fi, 'all').length)} ملف)</option>${who.map(r => `<option value="${r.x.i}"${fvs.t === r.x.i ? ' selected' : ''}>${esc(r.x.short)} (${nf(r.n)})</option>`).join('')}</select>
    </div>
    ${cur ? `<div class="seg fv-mode"><button id="fvGridBtn" class="${fvs.mode === 'grid' ? 'on' : ''}">كل الملفات (مصغّرة)</button><button id="fvOneBtn" class="${fvs.mode === 'one' ? 'on' : ''}">ملف واحد</button></div>` : ''}
    ${cur && fvs.mode === 'grid' ? `<div class="fv-grid" id="fvGrid">${files.map((r, j) => `<button class="fv-tile" data-k="${j}" data-key="${esc(r.t.name + '|' + f.key + '|' + r.x.n)}" title="${esc(r.t.short + ' — ' + r.x.n)}">
        <span class="th"><span class="ext">${esc(r.x.x || '—')}</span><span class="ph">…</span></span>
        <span class="cap"><b>${esc(r.x.n.split(' / ').pop())}</b><span>${esc(r.t.short)} · <span dir="ltr">${esc(r.x.d)}</span></span></span></button>`).join('')}</div>`
    : cur ? `<div class="fv-bar">
      <div class="fv-nav"><button class="btn ghost sm" id="fvPrev"${fvs.k ? '' : ' disabled'}>→ السابق</button><button class="btn ghost sm" id="fvNext"${fvs.k < files.length - 1 ? '' : ' disabled'}>التالي ←</button>
        <span class="muted" style="font-size:13.5px">الملف ${nf(fvs.k + 1)} من ${nf(files.length)}</span></div>
      <select class="search" id="fvK" aria-label="الملف" style="flex:1 1 260px;max-width:460px">${files.map((r, j) => `<option value="${j}"${j === fvs.k ? ' selected' : ''}>${esc(r.t.short)} — ${esc(r.x.n.split(' / ').pop())}</option>`).join('')}</select>
    </div>
    <div class="card fv-file"><span class="ext">${esc(cur.x.x || '—')}</span>
      <div class="grow"><b>${esc(cur.t.name)}</b><div class="nm">${esc(cur.x.n)} · <span dir="ltr">${esc(cur.x.d)}</span></div></div>
      <a class="btn sm" href="${esc(fileUrl(cur.c, cur.x.n))}" target="_blank" rel="noopener">فتح في OneDrive</a></div>
    <div id="fvPages" data-key="${esc(cur.t.name + '|' + f.key + '|' + cur.x.n)}"><div class="muted" style="padding:16px 0">جارٍ تحميل المحتوى…</div></div>`
    : '<div class="empty card">لا توجد ملفات في هذا المجلد بعد</div>'}
  </div></div>`;
}
async function fvShow(box) {
  const key = box.dataset.key;
  let e;
  try { e = (await loadPrev())[key]; }
  catch { box.innerHTML = '<div class="empty card">تعذّر تحميل المعاينات، تحققي من الاتصال ثم اضغطي «تحديث».</div>'; return; }
  if (!box.isConnected || box.dataset.key !== key) return;
  if (!e) { box.innerHTML = '<div class="empty card">تُجهَّز معاينة هذا الملف في التحديث القادم. يمكنك فتحه الآن من زر «فتح في OneDrive».</div>'; return; }
  if (!e.n) { box.innerHTML = `<div class="empty card">${KIND_NOTE[e.k] || KIND_NOTE.none}</div>`; return; }
  box.innerHTML = `<div class="fv-pages">${Array.from({ length: e.n }, (_, j) => `<img class="fv-page loading" alt="صفحة ${j + 1}" data-pg="${j + 1}">`).join('')}</div>`
    + (e.t ? `<p class="muted fv-more">تعرض المعاينة أول ${nf(e.n)} صفحات من ${nf(e.t)}، وبقية الصفحات في زر «فتح في OneDrive».</p>` : '');
  box.querySelectorAll('img[data-pg]').forEach(img => prevPage(e.id, +img.dataset.pg)
    .then(u => { img.src = u; img.classList.remove('loading'); })
    .catch(() => { img.replaceWith(Object.assign(document.createElement('div'), { className: 'warn', textContent: 'تعذّر تحميل هذه الصفحة' })); }));
  box.querySelectorAll('img[data-pg]').forEach(img => img.addEventListener('click', () => img.src && fvZoom(img.src, img.alt)));
}
function fvZoom(src, alt) {   // full-size view of one page; tap anywhere or Esc to close
  const lb = Object.assign(document.createElement('div'), { className: 'fv-lb', role: 'dialog' });
  lb.innerHTML = `<img alt="${esc(alt || '')}">`; lb.querySelector('img').src = src;
  const close = () => { lb.remove(); document.removeEventListener('keydown', esc$); };
  const esc$ = e => { if (e.key === 'Escape') close(); };
  lb.addEventListener('click', close); document.addEventListener('keydown', esc$); document.body.append(lb);
}
async function fvGrid(grid) {   // thumbnails = first page of each file, loaded as they scroll into view
  let idx;
  try { idx = await loadPrev(); } catch { grid.querySelectorAll('.ph').forEach(p => p.textContent = 'تعذّر التحميل'); return; }
  const io = new IntersectionObserver(es => es.forEach(en => {
    if (!en.isIntersecting) return;
    io.unobserve(en.target);
    const th = en.target.querySelector('.th'), ph = th.querySelector('.ph'), e = idx[en.target.dataset.key];
    if (!e) { ph.textContent = 'تُجهَّز المعاينة'; return; }
    if (!e.n) { ph.textContent = e.k === 'video' ? 'فيديو' : 'بلا معاينة'; return; }
    prevPage(e.id, 1).then(u => { if (!th.isConnected) return; const im = new Image(); im.alt = ''; im.src = u; ph.replaceWith(im); })
      .catch(() => { ph.textContent = 'تعذّر التحميل'; });
  }), { rootMargin: '300px' });
  grid.querySelectorAll('.fv-tile').forEach(t => io.observe(t));
}
function fvGo(k) { const n = fvFiles(fvs.fi, fvs.t).length; if (k < 0 || k >= n) return; fvs.k = k; route(); }
function bindFv(el) {
  el.querySelectorAll('[data-fv]').forEach(b => b.addEventListener('click', () => go('f/' + b.dataset.fv)));
  el.querySelector('#fvF')?.addEventListener('change', e => go('f/' + e.target.value));
  el.querySelector('#fvT')?.addEventListener('change', e => { fvs.t = e.target.value === 'all' ? 'all' : +e.target.value; fvs.k = 0; route(); });
  el.querySelector('#fvK')?.addEventListener('change', e => fvGo(+e.target.value));
  el.querySelector('#fvPrev')?.addEventListener('click', () => fvGo(fvs.k - 1));
  el.querySelector('#fvNext')?.addEventListener('click', () => fvGo(fvs.k + 1));
  el.querySelector('#fvGridBtn')?.addEventListener('click', () => { fvs.mode = 'grid'; route(); });
  el.querySelector('#fvOneBtn')?.addEventListener('click', () => { fvs.mode = 'one'; route(); });
  el.querySelectorAll('.fv-tile').forEach(t => t.addEventListener('click', () => { fvs.mode = 'one'; fvs.k = +t.dataset.k; route(); }));
  const grid = el.querySelector('#fvGrid'); if (grid) fvGrid(grid);
  const box = el.querySelector('#fvPages'); if (box) fvShow(box);
}
document.addEventListener('keydown', e => {   // ← → move between files on the folders page
  if (!el$fv() || fvs.mode !== 'one' || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === 'ArrowLeft') fvGo(fvs.k + 1);
  if (e.key === 'ArrowRight') fvGo(fvs.k - 1);
});
const el$fv = () => document.querySelector('#view .fv');

function board() {
  const head = D.folders.map(f => `<th title="${esc((f.group ? f.group + ' / ' : '') + f.label)}">${esc(f.label)}${f.group ? `<br><span class="muted" style="font-weight:400">مجتمع مهني</span>` : ''}</th>`).join('');
  const body = D.teachers.map(t => `<tr data-name="${esc(t.short)}"><th class="nm" data-go="t/${t.i}">${esc(t.short)}</th>${t.cells.map(c =>
    `<td class="c s-${c.s}" data-cell="${t.i},${c.f.i}">${c.info ? nf(c.info.count) : '—'}</td>`).join('')}<td class="pct" style="color:${pctColor(t.pct)}">${nf(t.pct)}%</td></tr>`).join('');
  return `<div class="toolbar"><input class="search" id="q" placeholder="ابحثي باسم المعلمة" type="search"></div>
  <div class="mx-wrap"><table class="mx"><thead><tr><th class="nm">المعلمة</th>${head}<th>الإنجاز</th></tr></thead><tbody>${body}</tbody></table></div>
  <div class="legend"><span><i style="background:var(--ok-bg);border:1px solid var(--ok)"></i>مكتمل</span><span><i style="background:var(--part-bg);border:1px solid var(--part)"></i>ناقص</span><span><i style="background:var(--none-bg);border:1px solid var(--none)"></i>فارغ</span><span><i style="background:var(--na-bg);border:1px solid var(--na)"></i>لا يوجد مجلد</span><span class="muted">· الرقم = عدد الملفات، اضغطيه لعرضها</span></div>`;
}

function cellSheet(ti, fi) {
  const t = D.teachers[ti], c = t.cells[fi];
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">
    <div class="head" style="margin-bottom:10px"><div style="flex:1"><div style="font-weight:700">${esc(t.name)}</div><div class="muted">${c.f.group ? esc(c.f.group) + ' / ' : ''}${esc(c.f.label)} · المطلوب ${nf(c.f.min)}</div></div>${chip(c.s)}</div>
    ${c.info ? (c.info.files.length ? `<ul class="files" style="padding:0;margin:0 -14px">${c.info.files.map(fileLi).join('')}</ul>` : '<div class="empty">المجلد فارغ</div>') : '<div class="empty">لا يوجد هذا المجلد عند المعلمة</div>'}
    <div class="toolbar" style="margin:14px 0 0">${c.info ? `<a class="btn sm" href="${esc(c.info.url)}" target="_blank" rel="noopener">فتح في OneDrive</a>` : ''}
    <button class="btn sm ghost" data-go="t/${ti}">صفحة المعلمة</button><button class="btn sm ghost" id="close">إغلاق</button></div></div>`;
  bg.addEventListener('click', e => { if (e.target === bg || e.target.id === 'close' || e.target.dataset.go) bg.remove(); });
  bind(bg); document.body.append(bg);
}

// --- the وكيلة: move duplicate / empty teacher files to «محذوفات المنصة» (same encrypted data/del channel; tools/inbox.js kind 'tfile')
let tdelFlags = [];
const tdelKey = (teacher, folder, n) => teacher + '|' + folder + '|' + n;
async function sendTDel(rows, btn) {
  const groups = {};
  rows.forEach(r => { const g = groups[r.t.name + '|' + r.c.f.key] ??= { teacher: r.t.name, folder: r.c.f.key, files: [], reason: [] };
    g.files.push(r.x.n); r.x.f.forEach(f => g.reason.includes(f) || g.reason.push(f)); });
  btn.disabled = true; btn.textContent = 'جارٍ الإرسال…';
  let ok = 0;
  for (const g of Object.values(groups)) {
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const req = { id, at: new Date().toISOString(), kind: 'tfile', teacher: g.teacher, folder: g.folder, files: g.files, reason: g.reason.join('، ') };
    const r = await ghApi(`data/del/${id}.json`, { method: 'PUT', body: JSON.stringify({ message: 'طلب', branch: D.gh.branch,
      content: toB64(utf8.encode(JSON.stringify(await sealBox(req, sessionCode)))) }) }).catch(() => null);
    if (r && r.ok) ok += g.files.length; else break;
  }
  toast(ok === rows.length ? `سُجّل حذف ${nf(ok)} ملف، ويُنفَّذ خلال دقائق` : ok ? `سُجّل ${nf(ok)} من ${nf(rows.length)}، أعيدي المحاولة للباقي` : 'تعذّر الإرسال، حاولي مرة أخرى');
  delReqs = null; route();
}
async function markTDel() {   // rows already requested show «بانتظار الحذف»
  try { delReqs = delReqs || await loadDelReqs(); } catch { return; }
  const pend = new Set(delReqs.filter(x => x.req.kind === 'tfile').flatMap(x => x.req.files.map(n => tdelKey(x.req.teacher, x.req.folder, n))));
  document.querySelectorAll('li[data-tk]').forEach(li => { if (!pend.has(li.dataset.tk)) return;
    const b = li.querySelector('[data-tdel]'); if (b) b.replaceWith(Object.assign(document.createElement('span'), { className: 'warn', textContent: 'بانتظار الحذف' })); });
  const left = tdelFlags.filter(r => !pend.has(tdelKey(r.t.name, r.c.f.key, r.x.n))), all = $('#tdelAll');
  if (all) { if (!left.length) all.remove(); else all.textContent = `حذف كل المكرر والفارغ (${nf(left.length)})`; }
  return left;
}
function bindTDel(el) {
  el.querySelectorAll('[data-tdel]').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'تأكيد الحذف'; b.classList.add('sure'); return; }
    sendTDel([tdelFlags.find(r => r.k === +b.dataset.tdel)], b);
  }));
  const all = el.querySelector('#tdelAll');
  if (all) all.addEventListener('click', async () => {
    const left = (await markTDel()) || tdelFlags;
    if (all.dataset.sure !== '1') { all.dataset.sure = '1'; all.textContent = `تأكيد: نقل ${nf(left.length)} ملف إلى «محذوفات المنصة»`; return; }
    sendTDel(left, all);
  });
  if (el.querySelector('li[data-tk]')) markTDel();
}
function alerts() {
  const flags = [], idle = [];
  D.teachers.forEach(t => {
    t.cells.forEach(c => {
      if (!c.info) return;
      c.info.files.filter(x => x.f).forEach(x => flags.push({ t, c, x, k: flags.length }));
      if (c.info.parentLoose && c.f.key.endsWith('\\الحلقات التنشيطية')) flags.push({ t, c, loose: c.info.parentLoose });
    });
    const d = daysSince(t.last);
    if (d === null || d >= 14) idle.push({ t, d });
  });
  idle.sort((a, b) => (b.d ?? 1e9) - (a.d ?? 1e9));
  tdelFlags = flags.filter(r => !r.loose);
  const msgs = D.teachers.filter(t => reminderFor(t));
  return `<h2>لم يرفعن منذ أسبوعين أو أكثر</h2>
  <div class="list">${idle.map(({ t, d }) => `<button class="row" data-go="t/${t.i}"><div class="grow"><div class="name">${esc(t.name)}</div><div class="sub">${d === null ? 'لم ترفع أي ملف' : `آخر رفع قبل ${nf(d)} يوم (${esc(t.last)})`}</div></div>${chip(d === null ? 'none' : 'part')}</button>`).join('') || '<div class="empty card">لا يوجد — الجميع نشط</div>'}</div>
  <div class="head" style="margin:22px 0 10px"><h2 style="margin:0">ملاحظات على الملفات</h2><div style="flex:1"></div>
    ${D.gh && tdelFlags.length ? `<button class="btn sm danger" id="tdelAll">حذف كل المكرر والفارغ (${nf(tdelFlags.length)})</button>` : ''}</div>
  ${D.gh && tdelFlags.length ? `<p class="muted" style="margin:-4px 0 10px;font-size:13px">«حذف» ينقل الملف إلى مجلد «محذوفات المنصة» في OneDrive (يمكن استرجاعه)، ويبقى الأصل في مكانه. يُنفَّذ خلال دقائق على جهاز المدرسة.</p>` : ''}
  <div class="card">${flags.length ? `<ul class="files">${flags.map(r => r.loose
    ? `<li><span class="ext">!</span><span class="n"><b>${esc(r.t.short)}</b> · ${nf(r.loose)} ملف في «المجتمع المهني» غير موزّع على المجلدات الفرعية</span></li>`
    : `<li data-tk="${esc(tdelKey(r.t.name, r.c.f.key, r.x.n))}"><span class="ext">${esc(r.x.x)}</span><span class="n"><b>${esc(r.t.short)}</b> · ${esc(r.c.f.label)} · ${esc(r.x.n)} <span class="warn">(${esc(r.x.f.join('، '))})</span></span>${D.gh ? `<button class="note-del" data-tdel="${r.k}">حذف</button>` : ''}</li>`).join('')}</ul>` : '<div class="empty">لا توجد ملاحظات</div>'}</div>
  <h2>رسائل التذكير (${nf(msgs.length)})</h2>
  <p class="muted" style="margin-top:-4px">رسالة جاهزة لكل معلمة لديها مجلدات ناقصة — افتحي صفحتها للنسخ أو الإرسال.</p>
  <div class="list">${msgs.map(teacherRow).join('')}</div>`;
}

function admins() {
  const A = D.admins || [];
  if (!A.length) return '<div class="empty">لا توجد مجلدات للإداريات</div>';
  return `<h2>مبادرات الإداريات <span class="muted" style="font-weight:400">· المطلوب ${nf(D.adminMin)} لكل إدارية</span></h2>
  <div class="list">${A.map((a, i) => { const s = status(a, D.adminMin); return `<details class="fold"><summary><div class="grow"><div class="t">${esc(a.name)}</div><div class="g">${nf(a.count)} ملف${a.last ? ' · آخر رفع ' + esc(a.last) : ''}</div></div>${chip(s)}</summary>
    ${a.files.length ? `<ul class="files">${a.files.map(fileLi).join('')}</ul>` : '<div class="empty">المجلد فارغ</div>'}
    <div class="acts"><a class="btn sm ghost" href="${esc(a.url)}" target="_blank" rel="noopener">فتح المجلد في OneDrive</a></div></details>`; }).join('')}</div>`;
}

/* ---------- chart tooltip (hover, or tap on phones) ---------- */
const tip = Object.assign(document.createElement('div'), { id: 'tip', hidden: true }); document.body.append(tip);
document.addEventListener('pointerover', e => {
  const x = e.target.closest('[data-tip]'); if (!x) { tip.hidden = true; return; }
  const r = x.getBoundingClientRect(); tip.textContent = x.dataset.tip; tip.hidden = false;
  tip.style.left = Math.min(innerWidth - tip.offsetWidth / 2 - 8, Math.max(tip.offsetWidth / 2 + 8, r.left + r.width / 2)) + 'px';
  tip.style.top = Math.max(tip.offsetHeight + 8, r.top - 6) + 'px';
});
addEventListener('scroll', () => tip.hidden = true, { passive: true });

/* ---------- start ---------- */
const saved = store.get();
if (saved) { $('#code').value = saved; unlock(saved, true); }
