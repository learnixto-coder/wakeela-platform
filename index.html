<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f5c4d">
<title>منصة مدرسة المتوسطة الحادية والعشرون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f5; --card:#fff; --ink:#17201d; --muted:#5f6b67; --line:#e2e7e5; --soft:#eef2f0;
  --brand:#0f5c4d; --brand-2:#13786a; --brand-ink:#fff;
  --ok:#1e7f4f; --ok-bg:#dcf2e5; --part:#8a5a00; --part-bg:#fdf0cf; --none:#b3261e; --none-bg:#fbe1de; --na:#6b7280; --na-bg:#eceef0;
  --shadow:0 1px 2px rgba(16,24,20,.06),0 4px 14px rgba(16,24,20,.05);
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1513; --card:#18201d; --ink:#e8eeec; --muted:#9aa8a3; --line:#2a3531; --soft:#1f2925;
  --brand:#2fa58c; --brand-2:#3bbfa3; --brand-ink:#06201a;
  --ok:#5fd39a; --ok-bg:#163a29; --part:#f2c25b; --part-bg:#3b2f12; --none:#ff8a80; --none-bg:#41201d; --na:#a3abb3; --na-bg:#262c31;
  --shadow:none; color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 "IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
a{color:var(--brand-2)}
[hidden]{display:none!important}

/* lock */
.lock{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.lock-box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 22px;box-shadow:var(--shadow);text-align:center}
.logo{width:56px;height:56px;border-radius:16px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;margin:0 auto 12px}
.lock h1{font-size:20px;margin:0 0 4px}
.lock p{color:var(--muted);margin:0 0 20px;font-size:14px}
.field{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--soft);text-align:center;letter-spacing:2px;font-size:17px;direction:ltr}
.field:focus{outline:2px solid var(--brand-2);outline-offset:1px}
.check{display:flex;gap:8px;align-items:center;justify-content:center;margin:12px 0 16px;color:var(--muted);font-size:14px}
.btn{display:inline-block;text-decoration:none;border:0;border-radius:12px;padding:11px 16px;background:var(--brand);color:var(--brand-ink);font-weight:600;cursor:pointer}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.err{color:var(--none);font-size:14px;min-height:22px;margin-top:10px}

/* shell */
header.top{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
.top h1{font-size:17px;margin:0;line-height:1.3}
.top small{display:block;opacity:.85;font-size:12.5px;font-weight:400}
.top .sp{flex:1}
.icon-btn{background:rgba(255,255,255,.14);border:0;color:inherit;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.ref-btn{background:#fff;color:var(--brand);border:0;height:38px;padding:0 14px;border-radius:10px;display:flex;align-items:center;gap:7px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.ref-btn:disabled{opacity:.75;cursor:wait}
.ref-btn.busy svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
nav.tabs{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:4}
.tabs-in{max-width:1100px;margin:0 auto;display:flex;overflow-x:auto;padding:0 8px;scrollbar-width:none}
.tabs button{flex:0 0 auto;background:none;border:0;padding:12px 14px;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--brand-2);border-color:var(--brand-2)}
main{max-width:1100px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
h2{font-size:17px;margin:22px 0 10px}
h2:first-child{margin-top:4px}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:14px 16px}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{padding:14px}
.kpi b{display:block;font-size:26px;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:13px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}

/* bars */
.bars{display:grid;gap:2px}
.bar-row{display:grid;grid-template-columns:minmax(110px,190px) 1fr 52px;gap:10px;align-items:center;padding:8px 6px;border-radius:10px;cursor:pointer;background:none;border:0;text-align:start;width:100%}
.bar-row:hover{background:var(--soft)}
@media (max-width:640px){.bar-row{grid-template-columns:1fr 44px;row-gap:6px}.bar-row .track{grid-column:1/-1;grid-row:2}}
.track{height:10px;border-radius:6px;background:var(--soft);overflow:hidden;display:flex}
.track i{display:block;height:100%}
.track .o{background:var(--ok)} .track .p{background:#e0a526} .track .n{background:var(--none);opacity:.55}
.pct{font-variant-numeric:tabular-nums;font-weight:600;text-align:left;direction:ltr}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}

/* chips & lists */
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.s-ok{background:var(--ok-bg);color:var(--ok)} .s-part{background:var(--part-bg);color:var(--part)}
.s-none{background:var(--none-bg);color:var(--none)} .s-na{background:var(--na-bg);color:var(--na)}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.row:hover{border-color:var(--brand-2)}
.row .grow{flex:1;min-width:0}
.row .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{color:var(--muted);font-size:13px}
.ring{--v:0;width:46px;height:46px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:12.5px;font-weight:700;
  background:radial-gradient(closest-side,var(--card) 76%,transparent 78%),conic-gradient(var(--c,var(--ok)) calc(var(--v)*1%),var(--soft) 0)}
.ring.lg{width:104px;height:104px;font-size:24px}

/* dashboards */
.hero{display:flex;gap:18px;align-items:center;padding:18px;margin-bottom:12px;flex-wrap:wrap}
.hero .grow{flex:1;min-width:200px}
.hero h2{margin:0 0 4px;font-size:20px}
.hero p{margin:0;color:var(--muted)}
.cmp{margin-top:10px;display:grid;gap:6px;max-width:420px}
.cmp-r{display:grid;grid-template-columns:92px 1fr 44px;gap:8px;align-items:center;font-size:13px}
.cmp-r .track{height:8px}
.cmp-r .track i{border-radius:6px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media (max-width:760px){.dgrid{grid-template-columns:1fr}}
.dcard h3{margin:0 0 2px;font-size:15px}
.dcard .muted{font-size:12.5px}
.wk{display:flex;align-items:stretch;gap:5px;height:160px;margin-top:10px}
.wk-col{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.wk-b{flex:1;width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.wk-b i{display:block;width:100%;max-width:26px;background:var(--brand-2);opacity:.5;border-radius:4px 4px 0 0;min-height:2px}
.wk-col.cur .wk-b i{opacity:1}
.wk-col:hover .wk-b i{opacity:.85}
.wk-v{font-size:11.5px;font-weight:600;color:var(--muted);line-height:1.4}
.wk-l{font-size:11px;color:var(--muted);margin-top:4px;border-top:1px solid var(--line);width:100%;text-align:center;padding-top:3px}
.fmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;margin-top:10px}
.ftile{border:0;border-radius:12px;padding:10px 12px;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.ftile b{font-size:13.5px;line-height:1.35}
.ftile small{font-size:11.5px;opacity:.85}
.ftile .n{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;margin-top:4px}
.ftile:hover{filter:brightness(.97)}
.fold{scroll-margin-top:140px}
.rank{display:grid;gap:2px;margin-top:8px}
.rank .bar-row{grid-template-columns:minmax(120px,200px) 1fr 52px}
@media (max-width:640px){.rank .bar-row{grid-template-columns:1fr 44px}}
.note-in{display:block;width:100%;font:inherit;font-size:14px;line-height:1.7;resize:vertical;color:var(--ink)}
.note-in:focus{outline:2px solid var(--brand-2);outline-offset:1px}
.notes{display:grid;gap:8px}
.note{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
.note.new{border-color:var(--brand-2);box-shadow:inset 3px 0 0 var(--brand-2)}
.note-h{display:flex;align-items:center;gap:8px;justify-content:space-between;color:var(--muted);font-size:12.5px;margin-bottom:4px}
.note-b{white-space:pre-wrap;font-size:14px}
.note-del{background:none;border:1px solid var(--line);border-radius:8px;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 8px}
.note-del.sure{color:var(--none);border-color:var(--none)}
.inbox{margin-bottom:12px;border-color:var(--brand-2)}
.inbox-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--brand-2)}
.inbox-h b{color:var(--ink);font-size:15.5px}
.up{margin-bottom:12px}
.up-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;color:var(--brand-2)}
.up-h b{color:var(--ink);font-size:15.5px}
.up-h .muted{font-size:12.5px;flex-basis:100%}
.up-l{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.up select{width:100%;margin-bottom:10px}
.up-drop{display:flex;align-items:center;justify-content:center;text-align:center;border:2px dashed var(--line);border-radius:12px;padding:18px 12px;cursor:pointer;background:var(--soft)}
.up-drop:hover{border-color:var(--brand-2)}
.up-drop .muted{font-size:12.5px}
.up-list{display:grid;gap:6px;margin:10px 0}
.up-list:empty{display:none}
.up-f{display:flex;align-items:center;gap:8px;font-size:13.5px}
.up-f .n{flex:1;min-width:0;overflow-wrap:anywhere}
.up-pend{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--soft);font-size:13px;display:grid;gap:4px}
#tip{position:fixed;z-index:40;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:6px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1;min-width:180px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
select.search{flex:0 1 auto}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;cursor:pointer;color:var(--muted);font-size:13.5px}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}

/* teacher detail */
body.tmode nav.tabs{display:none}
.lock .hint{font-size:13px;margin:-12px 0 16px}
.back{background:none;border:0;color:var(--brand-2);cursor:pointer;padding:4px 0;font-weight:600}
.head{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.head h2{margin:0}
.fold{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.fold summary{list-style:none;display:flex;gap:10px;align-items:center;padding:12px 14px;cursor:pointer}
.fold summary::-webkit-details-marker{display:none}
.fold summary .grow{flex:1;min-width:0}
.fold summary .t{font-weight:600}
.fold summary .g{color:var(--muted);font-size:12.5px}
.fold[open] summary{border-bottom:1px solid var(--line)}
.files{list-style:none;margin:0;padding:6px 0}
.files li{display:flex;gap:10px;padding:7px 14px;font-size:13.5px;align-items:baseline}
.files li .n{flex:1;min-width:0;overflow-wrap:anywhere}
.files li .d{color:var(--muted);font-size:12.5px;white-space:nowrap;direction:ltr}
.ext{font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--soft);color:var(--muted);text-transform:uppercase;direction:ltr}
.warn{color:var(--part);font-size:12.5px}
.fold .acts{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}

/* reminder box */
.msg{white-space:pre-wrap;background:var(--soft);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:14px}

/* وكيلة sections */
.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.sec{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px;cursor:pointer;text-align:start;border:1px solid var(--line)}
.sec:hover{border-color:var(--brand-2)}
.sec .track{width:100%;margin-top:4px}
.sec-ic{width:42px;height:42px;border-radius:12px;background:var(--ok-bg);color:var(--brand-2);display:grid;place-items:center;flex:0 0 auto}
.sec-t{font-weight:700;font-size:16px}
.sec-s{color:var(--muted);font-size:13px}
.sec-l{font-size:12px;color:var(--brand-2);font-weight:600}
@media (max-width:640px){.secs{grid-template-columns:1fr 1fr}.sec{padding:12px}.sec-t{font-size:14.5px}}
.sub-row{display:flex;gap:10px;align-items:center;padding:12px 14px}
.sub-row .t{font-weight:600}.sub-row .g{color:var(--muted);font-size:12.5px}
.link-row{display:flex;gap:10px;align-items:center;width:100%;padding:9px 14px;background:var(--soft);border:0;border-top:1px solid var(--line);cursor:pointer;font-size:13.5px;text-align:start;flex-wrap:wrap}
.link-row .track{background:var(--line)}
.link-row.card{border:1px solid var(--line);border-radius:12px;background:var(--card)}
.crumbs{font-size:13.5px}.crumbs a{text-decoration:none;font-weight:600}

/* matrix */
.mx-wrap{overflow:auto;max-height:75vh;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table.mx{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.mx th,.mx td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.mx thead th{position:sticky;top:0;background:var(--card);z-index:2;font-weight:600;vertical-align:bottom;font-size:12px;line-height:1.35;white-space:normal;min-width:64px}
.mx th.nm{position:sticky;right:0;background:var(--card);z-index:1;text-align:start;font-weight:600;cursor:pointer}
.mx thead th.nm{z-index:3}
.mx td.c{cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums}
.mx td.c.s-ok{background:var(--ok-bg)} .mx td.c.s-part{background:var(--part-bg)} .mx td.c.s-none{background:var(--none-bg)} .mx td.c.s-na{background:var(--na-bg)}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:85vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;z-index:30}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* برامج الخطة التشغيلية */
.ppl{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.ppl span{font-size:12px;padding:1px 9px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.ppl span.nolog{color:var(--muted);border-style:dashed}
.plan-link{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:14px 16px;cursor:pointer;text-align:start;font:inherit;color:inherit}
.plan-link:hover{border-color:var(--brand-2)}
.ck{display:flex;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);cursor:pointer;font-size:13.5px}
.ck input{width:18px;height:18px;flex:0 0 auto}
.ck .n{flex:1;min-width:0;overflow-wrap:anywhere}
.ck.pend{opacity:.55;cursor:default}
.note-close{margin-inline-start:auto}
.ttabs{display:flex;margin:0 0 14px}.ttabs button{flex:1;padding:10px 8px;font-size:14.5px}
.btn.danger{background:var(--none);border-color:var(--none)}
.foot{margin-top:28px;color:var(--muted);font-size:12.5px;text-align:center}
</style>
</head>
<body>

<section class="lock" id="lock">
  <form class="lock-box" id="lockForm">
    <div class="logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="m9 13 2 2 4-4"/></svg></div>
    <h1>منصة مدرسة المتوسطة الحادية والعشرون</h1>
    <p>متابعة الإنجاز والخطط · 1448هـ</p>
    <p class="hint">المعلمة: أدخلي رقم جوالك (05xxxxxxxx)</p>
    <input class="field" id="code" autocomplete="current-password" placeholder="رقم الجوال أو رمز الدخول" autocapitalize="characters" spellcheck="false">
    <label class="check"><input type="checkbox" id="remember" checked> تذكّر الرمز على هذا الجهاز</label>
    <button class="btn wide" id="go">دخول</button>
    <div class="err" id="err"></div>
  </form>
</section>

<div id="app" hidden>
  <header class="top"><div class="top-in">
    <div><h1 id="title">منصة مدرسة المتوسطة الحادية والعشرون</h1><small id="meta"></small></div>
    <div class="sp"></div>
    <button class="ref-btn" id="reload" title="جلب أحدث البيانات"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg><span>تحديث</span></button>
    <button class="icon-btn" id="logout" title="خروج" aria-label="خروج"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17 5 12l5-5"/><path d="M5 12h12"/></svg></button>
  </div></header>
  <nav class="tabs"><div class="tabs-in" id="tabs">
    <button data-v="me">ملفات الوكيلة</button>
    <button data-v="dash">لوحة المؤشرات</button>
    <button data-v="home">متابعة المعلمات</button>
    <button data-v="teachers">المعلمات</button>
    <button data-v="folders">المجلدات</button>
    <button data-v="board">لوحة التتبع</button>
    <button data-v="alerts">التنبيهات</button>
    <button data-v="admins">الإداريات</button>
    <button data-v="plan">برامج الخطة 1448هـ</button>
    <button data-v="pdel">حذف الشواهد</button>
    <button data-v="plans">لوحة الخطط</button>
  </div></nav>
  <main id="view"></main>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = n => Number(n).toLocaleString('en-US');
const KEY = 'wk-platform-code';
let D = null;           // decrypted data
let state = { fFilter: 'all', fSort: 'pct', pFilter: 'all' };

/* ---------- decrypt ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
// teacher login: mobile number (Arabic digits, +966 / 00966 / 5xxxxxxxx accepted) -> 05xxxxxxxx
const phoneOf = s => { const d = String(s).replace(/[٠-٩]/g, c => '٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[\s\-+()]/g, '');
  if (!/^\d+$/.test(d)) return null; const p = d.replace(/^(00)?966/, '').replace(/^0?/, '0'); return /^05\d{8}$/.test(p) ? p : null; };
const utf8 = new TextEncoder();
const toB64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s); };
const idCache = {};
async function teacherId(phone) {   // same PBKDF2 as tools/export.js; names both data/t/<id> and data/n/<id>
  if (idCache[phone]) return idCache[phone];
  const base = await crypto.subtle.importKey('raw', utf8.encode(phone), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: utf8.encode('wk-platform/t'), iterations: 100000, hash: 'SHA-256' }, base, 96);
  return idCache[phone] = [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function aesKey(pass, salt, iter) {
  const base = await crypto.subtle.importKey('raw', utf8.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function openBox(e, pass) {
  const key = await aesKey(pass, b64(e.salt), e.iter);
  let plain;
  try { plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(e.iv) }, key, b64(e.ct)); }
  catch { throw new Error('code'); }
  return JSON.parse(await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
}
async function sealBox(obj, pass) {   // same format as encrypt() in tools/export.js
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const gz = new Uint8Array(await new Response(new Blob([JSON.stringify(obj)]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await aesKey(pass, salt, 250000), gz));
  return { v: 1, iter: 250000, salt: toB64(salt), iv: toB64(iv), ct: toB64(ct) };
}
async function load(code) {
  const phone = phoneOf(code), id = phone && await teacherId(phone);
  const r = await fetch((phone ? `data/t/${id}.json` : 'data/w.json') + '?t=' + Date.now(), { cache: 'no-store' });
  if (phone && r.status === 404) throw new Error('phone');
  if (!r.ok) throw new Error('net');
  const data = await openBox(await r.json(), phone || code);
  if (phone) data.notes = await fetch(`data/n/${id}.json?t=${Date.now()}`, { cache: 'no-store' })
    .then(n => n.ok ? n.json().then(e => openBox(e, phone)).then(x => x.items) : []).catch(() => []);
  return data;
}
const store = { get() { try { return localStorage.getItem(KEY) } catch { return null } }, set(v) { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY) } catch {} } };

async function unlock(code, remember) {
  $('#err').textContent = ''; $('#go').disabled = true; $('#go').textContent = 'جارٍ الفتح…';
  try {
    const c = phoneOf(code) || code.trim().toUpperCase();
    D = await load(c);
    if (remember) store.set(c);
    sessionCode = c;
    prep(); $('#lock').hidden = true; $('#app').hidden = false; route();
  } catch (e) {
    $('#err').textContent = { code: 'الرمز غير صحيح', phone: 'الرقم غير مسجّل في المنصة، راجعي الوكيلة' }[e.message] || 'تعذّر تحميل البيانات، تحققي من الاتصال';
    store.set(null);
  } finally { $('#go').disabled = false; $('#go').textContent = 'دخول'; }
}
let sessionCode = null;
$('#lockForm').addEventListener('submit', e => { e.preventDefault(); if ($('#code').value.trim()) unlock($('#code').value, $('#remember').checked); });
$('#logout').onclick = () => { store.set(null); sessionCode = null; D = null; $('#app').hidden = true; $('#lock').hidden = false; $('#code').value = ''; document.body.classList.remove('tmode'); location.hash = ''; };
$('#reload').onclick = async () => {
  const b = $('#reload'), lbl = b.querySelector('span'), before = D && D.generated;
  b.disabled = true; b.classList.add('busy'); lbl.textContent = 'جارٍ التحديث…';
  try {
    D = await load(sessionCode); prep(); route();
    toast(D.generated !== before ? 'تم جلب بيانات أحدث' : 'البيانات محدّثة — لا جديد منذ آخر تحديث');
  } catch { toast('تعذّر التحديث، تحققي من الاتصال'); }
  finally { b.disabled = false; b.classList.remove('busy'); lbl.textContent = 'تحديث'; }
};

new ResizeObserver(([e]) => { $('nav.tabs').style.top = e.target.offsetHeight + 'px'; }).observe($('header.top'));

/* ---------- model ---------- */
function status(info, min) {
  if (!info) return 'na';
  if (info.count >= min) return 'ok';
  return info.count > 0 ? 'part' : 'none';
}
const S_LABEL = { ok: 'مكتمل', part: 'ناقص', none: 'لم ترفع', na: 'لا يوجد مجلد' };
const chip = s => `<span class="chip s-${s}">${S_LABEL[s]}</span>`;
const short = n => n.replace(/^أ\.\s*/, '').replace(/\s+/g, ' ');
const folderTitle = f => f.group ? `${f.label}` : f.label;

function prep() {
  D.folders.forEach((f, i) => f.i = i);
  D.teachers.forEach((t, i) => {
    t.i = i; t.short = short(t.name);
    t.cells = D.folders.map(f => { const info = t.folders[f.key]; return { f, info, s: status(info, f.min) }; });
    const exist = t.cells.filter(c => c.s !== 'na');
    t.done = exist.filter(c => c.s === 'ok').length; t.exist = exist.length;
    t.pct = t.exist ? Math.round(t.done / t.exist * 100) : 0;
    t.last = exist.map(c => c.info.last).filter(Boolean).sort().pop() || '';
  });
  D.plan = D.plan || []; D.extra = D.extra || []; D.extra.forEach((x, k) => x.k = k);
  D.plan.forEach((p, k) => { p.k = k; p.n = p.ev?.count || 0; p.s = !p.ev ? 'na' : p.n ? 'ok' : 'none'; });
  const tm = D.kind === 'teacher';
  document.body.classList.toggle('tmode', tm);
  $('#title').textContent = tm ? (D.teachers.length === 1 ? D.teachers[0].name : D.planOnly ? D.teachers.map(t => t.name).join(' · ') : 'متابعة إنجازي') : 'منصة مدرسة المتوسطة الحادية والعشرون';
  const d = new Date(D.generated);
  $('#meta').textContent = `${D.week} · آخر تحديث ${d.toLocaleDateString('ar-SA-u-ca-islamic-umalqura-nu-latn', { day: 'numeric', month: 'long' })} ${d.toLocaleTimeString('ar-SA-u-nu-latn', { hour: 'numeric', minute: '2-digit' })}`;
}
function daysSince(iso) { return iso ? Math.floor((new Date(D.generated) - new Date(iso)) / 864e5) : null; }
const pctColor = p => p >= 80 ? 'var(--ok)' : p >= 40 ? '#e0a526' : 'var(--none)';
const ring = p => `<div class="ring" style="--v:${p};--c:${pctColor(p)}">${nf(p)}%</div>`;

/* ---------- routing ---------- */
window.addEventListener('hashchange', route);
function go(h) { location.hash = h; }
function route() {
  if (!D) return;
  const [v, a] = (location.hash.slice(1) || 'me').split('/');
  if (D.kind === 'teacher') {   // a teacher sees only her own page(s)
    const one = D.teachers.length === 1, i = one ? 0 : v === 't' && D.teachers[+a] ? +a : -1;
    // programs first: the programs page is the landing page; «ملفاتي» (#mine) is her folders page
    const mine = !D.planOnly && (v === 'mine' || v === 't' || !D.plan.length);
    $('#view').innerHTML = v === 'x' && D.extra[+a] ? teacherExtra(+a)
      : !mine ? (v === 'plan' && a !== undefined && a !== '' ? teacherProgram(+a) : tTabs('plan') + teacherPlan())
      : tTabs('mine') + (i >= 0 ? teacher(i) : `<h2 style="margin:6px 0 12px">اختاري اسمك</h2><div class="list">${D.teachers.map(teacherRow).join('')}</div>`);
    bind($('#view')); window.scrollTo(0, 0); return;
  }
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === (v === 't' ? 'teachers' : v === 'f' ? 'folders' : v === 'w' ? 'me' : v)));
  const el = $('#view');
  el.innerHTML = ({ me, dash, w: () => wNode(a || ''), home, teachers, folders, board, alerts, admins, t: () => teacher(+a), f: () => folder(+a),
    plan: planW, pdel: () => planDel(a), plans: plansW }[v] || me)();
  bind(el); window.scrollTo(0, 0);
}
document.querySelector('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.v); });
function bind(el) {
  el.querySelectorAll('[data-go]').forEach(x => x.addEventListener('click', () => go(x.dataset.go)));
  el.querySelectorAll('[data-open]').forEach(x => x.addEventListener('click', () => {
    const d = el.querySelector(`details[data-fi="${x.dataset.open}"]`); if (d) { d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'start' }); } }));
  const txt = id => { const n = document.getElementById(id); return n.value ?? n.innerText; };
  el.querySelectorAll('[data-copy]').forEach(x => x.addEventListener('click', () => copy(txt(x.dataset.copy))));
  el.querySelectorAll('[data-wa]').forEach(x => x.addEventListener('click', () => window.open('https://wa.me/?text=' + encodeURIComponent(txt(x.dataset.wa)), '_blank')));
  const sent = el.querySelector('#sent'); if (sent) renderSent(+sent.dataset.t);
  const up = el.querySelector('#up'); if (up) bindUpload(up, D.teachers[+up.dataset.t]);
  el.querySelectorAll('[data-attach]').forEach(x => x.addEventListener('click', () => {
    $('#upF').value = x.dataset.attach; $('#up').scrollIntoView({ behavior: 'smooth', block: 'start' }); $('#upI').click(); }));
  el.querySelectorAll('[data-close]').forEach(x => x.addEventListener('click', () => closeNote(x.dataset.close, +x.dataset.t)));
  const pd = el.querySelector('#pdel'); if (pd) bindPlanDel(pd);
  const op = el.querySelector('#openPlans'); if (op) op.addEventListener('click', openPlans);
  el.querySelectorAll('[data-pf]').forEach(x => x.addEventListener('click', () => { state.pFilter = x.dataset.pf; route(); }));
  const sn = el.querySelector('#sendNote'); if (sn) sn.addEventListener('click', () => sendNote(+sn.dataset.t));
  el.querySelectorAll('[data-cell]').forEach(x => x.addEventListener('click', () => { const [t, f] = x.dataset.cell.split(','); cellSheet(+t, +f); }));
  const q = el.querySelector('#q'); if (q) q.addEventListener('input', () => filterRows(q.value));
  el.querySelectorAll('[data-filter]').forEach(x => x.addEventListener('click', () => { state.fFilter = x.dataset.filter; route(); }));
  el.querySelectorAll('[data-sort]').forEach(x => x.addEventListener('click', () => { state.fSort = x.dataset.sort; route(); }));
}
function filterRows(q) {
  const n = q.trim().replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه');
  document.querySelectorAll('[data-name]').forEach(r => r.hidden = n && !r.dataset.name.replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').includes(n));
}
async function copy(t) {
  try { await navigator.clipboard.writeText(t); toast('تم النسخ'); }
  catch { const a = document.createElement('textarea'); a.value = t; document.body.append(a); a.select(); document.execCommand('copy'); a.remove(); toast('تم النسخ'); }
}
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 1800); }

/* ---------- ملفات الوكيلة ---------- */
const SEC_ICON = {
  'الخطط': '<path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/>',
  'المبادرات': '<path d="M12 3v3M5.6 5.6l2.1 2.1M3 12h3M18.4 5.6l-2.1 2.1M21 12h-3"/><path d="M9 18h6M10 21h4"/><path d="M12 8a4 4 0 0 0-2.5 7.1V18h5v-2.9A4 4 0 0 0 12 8z"/>',
  'مجتمعات التعلم المهنية': '<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20a6 6 0 0 1 12 0M14.5 20a4.5 4.5 0 0 1 7-3.7"/>',
  'بيانات المدرسة': '<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>',
  'بطاقة نافس': '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  'التقويم': '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 15l2 2 4-4"/>',
};
const secIcon = n => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${SEC_ICON[Object.keys(SEC_ICON).find(k => n.startsWith(k))] || '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'}</svg>`;
function nodeAt(p) { let n = D.wakeela; for (const i of p ? p.split('.') : []) n = n?.subs[+i]; return n; }
// folders that should hold files: a section's sub-folders (or the section itself); deeper levels (e.g. one per student) count with their parent
function leaves(n, d = 0) { return n.subs.length && d < 2 ? n.subs.flatMap(s => leaves(s, d + 1)) : [n]; }
// teachers' progress for a linked folder: {ok, n, go}
function linkStat(link) {
  if (link === '@admins') { const A = D.admins || []; return { ok: A.filter(a => status(a, D.adminMin) === 'ok').length, n: A.length, go: 'admins', who: 'الإداريات' }; }
  const f = D.folders.find(x => x.key === link); if (!f) return null;
  const cs = D.teachers.map(t => t.cells[f.i]).filter(c => c.s !== 'na');
  return { ok: cs.filter(c => c.s === 'ok').length, n: cs.length, go: 'f/' + f.i, who: 'المعلمات' };
}

function me() {
  const W = D.wakeela; if (!W) return '<div class="empty">مجلد الوكيلة غير متاح</div>';
  const all = leaves(W).filter(n => !n.link), filled = all.filter(n => n.total).length;
  const secs = W.subs.map((s, i) => {
    const lv = leaves(s, 1).filter(n => !n.link), f = lv.filter(n => n.total).length, p = lv.length ? Math.round(f / lv.length * 100) : 0;
    const linked = leaves(s, 1).filter(n => n.link).length;
    return `<button class="sec card" data-go="w/${i}"><span class="sec-ic">${secIcon(s.name)}</span>
      <span class="sec-t">${esc(s.name)}</span>
      <span class="sec-s">${!lv.length ? 'تُجمع من مجلدات المعلمات' : s.subs.length ? `${nf(f)} من ${nf(lv.length)} مجلد فيه ملفات` : (s.total ? `${nf(s.total)} ملف` : 'فارغ')}</span>
      ${lv.length ? `<span class="track"><i class="o" style="width:${p}%"></i></span>` : ""}
      ${linked ? `<span class="sec-l">${nf(linked)} مرتبط بمجلدات المعلمات</span>` : ''}</button>`;
  }).join('');
  const recent = (function walk(n, path) { return n.files.map(x => ({ x, path })).concat(n.subs.flatMap(s => walk(s, path ? path + ' / ' + s.name : s.name))); })(W, '')
    .sort((a, b) => b.x.d.localeCompare(a.x.d)).slice(0, 6);
  return `
  <div class="head" style="margin-bottom:6px"><h2 style="margin:4px 0">ملفات وكيلة المدرسة 1448هـ</h2><div style="flex:1"></div>
    <a class="btn sm ghost" href="${esc(W.url)}" target="_blank" rel="noopener">فتح في OneDrive</a></div>
  <div class="kpis" style="margin-top:10px">
    <div class="card kpi"><b>${nf(W.subs.length)}</b><span>أقسام رئيسية</span></div>
    <div class="card kpi"><b>${nf(W.total)}</b><span>ملفًا في مجلدات الوكيلة</span></div>
    <div class="card kpi"><b style="color:${pctColor(Math.round(filled / all.length * 100))}">${nf(filled)} / ${nf(all.length)}</b><span>مجلدات فيها ملفات</span></div>
    <div class="card kpi"><b style="color:${all.length - filled ? 'var(--none)' : 'inherit'}">${nf(all.length - filled)}</b><span>مجلدات تحتاج ملفات</span></div>
  </div>
  <h2>الأقسام</h2>
  <div class="secs">${secs}</div>
  ${recent.length ? `<h2>آخر ما أُضيف</h2><div class="card"><ul class="files">${recent.map(r => `<li><span class="ext">${esc(r.x.x || '—')}</span><span class="n">${esc(r.x.n)}<br><span class="muted">${esc(r.path)}</span></span><span class="d">${esc(r.x.d)}</span></li>`).join('')}</ul></div>` : ''}
  <p class="foot">ملفات الفاحص ولوحة المتابعة المولَّدة تلقائيًا لا تُحسب ضمن ملفات الوكيلة</p>`;
}

function wNode(p) {
  const n = nodeAt(p); if (!n) return me();
  const parts = p.split('.'), crumbs = [`<a href="#me">ملفات الوكيلة</a>`];
  parts.slice(0, -1).forEach((_, k) => { const q = parts.slice(0, k + 1).join('.'); crumbs.push(`<a href="#w/${q}">${esc(nodeAt(q).name)}</a>`); });
  const subs = n.subs.map((s, i) => {
    const ls = s.link && linkStat(s.link);
    return `<div class="fold"><div class="sub-row">
      <button class="grow" data-go="w/${p}.${i}" style="all:unset;cursor:pointer;flex:1;min-width:0">
        <div class="t">${esc(s.name)}</div>
        <div class="g">${s.total ? `${nf(s.total)} ملف` : 'لا توجد ملفات بعد'}${s.subs.length ? ` · ${nf(s.subs.length)} مجلد فرعي` : ''}${s.files[0] ? ' · آخر إضافة ' + esc(s.files[0].d) : ''}</div></button>
      ${s.total ? chip('ok').replace('مكتمل', 'فيه ملفات') : ls ? '<span class="chip s-na">مرتبط</span>' : chip('none').replace('لم ترفع', 'فارغ')}</div>
      ${ls ? `<button class="link-row" data-go="${ls.go}"><span>${ls.who}: <b>${nf(ls.ok)} من ${nf(ls.n)}</b> مكتمل</span><span class="track" style="flex:1;max-width:160px"><i class="o" style="width:${ls.n ? ls.ok / ls.n * 100 : 0}%"></i></span><span class="muted">عرض ←</span></button>` : ''}
    </div>`;
  }).join('');
  const ls = n.link && linkStat(n.link);
  return `<div class="crumbs">${crumbs.join(' <span class="muted">/</span> ')}</div>
  <div class="head" style="margin:8px 0 14px"><span class="sec-ic">${secIcon(nodeAt(parts[0]).name)}</span><h2 style="margin:0">${esc(n.name)}</h2><div style="flex:1"></div>
    <a class="btn sm" href="${esc(n.url)}" target="_blank" rel="noopener">فتح في OneDrive</a></div>
  ${ls ? `<button class="link-row card" data-go="${ls.go}" style="margin-bottom:14px"><span>يجمع ملفات ${ls.who}: <b>${nf(ls.ok)} من ${nf(ls.n)}</b> مكتمل</span><span class="track" style="flex:1;max-width:200px"><i class="o" style="width:${ls.n ? ls.ok / ls.n * 100 : 0}%"></i></span><span class="muted">عرض ←</span></button>` : ''}
  ${subs ? `<div class="list">${subs}</div>` : ''}
  ${n.files.length ? `<h2>الملفات (${nf(n.files.length)})</h2><div class="card"><ul class="files">${n.files.map(fileLi).join('')}</ul></div>`
    : (!n.subs.length ? '<div class="card empty">لا توجد ملفات في هذا المجلد بعد — افتحيه في OneDrive لإضافة الملفات</div>' : '')}`;
}

/* ---------- views ---------- */
function home() {
  const T = D.teachers, all = T.flatMap(t => t.cells.filter(c => c.s !== 'na'));
  const done = all.filter(c => c.s === 'ok').length, pct = all.length ? Math.round(done / all.length * 100) : 0;
  const full = T.filter(t => t.exist && t.done === t.exist).length;
  const zero = T.filter(t => t.cells.every(c => !c.info || !c.info.count)).length;
  const files = T.reduce((s, t) => s + t.total, 0);
  const bars = D.folders.map(f => {
    const cs = T.map(t => t.cells[f.i]).filter(c => c.s !== 'na'), n = cs.length || 1;
    const o = cs.filter(c => c.s === 'ok').length, p = cs.filter(c => c.s === 'part').length, z = cs.filter(c => c.s === 'none').length;
    return `<button class="bar-row" data-go="f/${f.i}"><span>${esc(f.label)}${f.group ? ` <span class="muted" style="font-size:12px">· ${esc(f.group)}</span>` : ''}</span>
      <span class="track"><i class="o" style="width:${o / n * 100}%"></i><i class="p" style="width:${p / n * 100}%"></i><i class="n" style="width:${z / n * 100}%"></i></span>
      <span class="pct">${Math.round(o / n * 100)}%</span></button>`;

/* ---------- alerts: data/n/<teacherId>.json, encrypted with the teacher's phone ----------

const ghApi = (p, opt = {}) => fetch(`https://api.github.com/repos/${D.gh.repo}/contents/${p}`, { cache: 'no-store', ...opt,
  headers: { Authorization: 'Bearer ' + D.gh.token, Accept: 'application/vnd.github+json', ...(opt.headers || {}) } });
async function notesFor(t) {
  const phone = D.phones?.[t.name]; if (!phone) return null;
  const path = `data/n/${await teacherId(phone)}.json`;
  let box = null, sha;
  if (D.gh) {
    const r = await ghApi(`${path}?ref=${D.gh.branch}&t=${Date.now()}`);
    if (r.ok) { const j = await r.json(); sha = j.sha; box = JSON.parse(new TextDecoder().decode(b64(j.content.replace(/\s/g, '')))); }
    else if (r.status !== 404) throw new Error('gh' + r.status);
  } else {
    const r = await fetch(path + '?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) box = await r.json();
  }
  return { path, phone, sha, items: box ? (await openBox(box, phone)).items : [] };
}
async function saveNotes(t, change) {   // read-modify-write; one retry if someone else wrote in between
  for (let n = 0; ; n++) {
    const cur = await notesFor(t); change(cur.items);
    const body = { message: 'تحديث التنبيهات', branch: D.gh.branch, content: toB64(utf8.encode(JSON.stringify(await sealBox({ items: cur.items }, cur.phone)))), ...(cur.sha && { sha: cur.sha }) };
    const r = await ghApi(cur.path, { method: 'PUT', body: JSON.stringify(body) });
    if (r.ok) return cur.items;

  }
}

// one encrypted message to the PC inbox: an upload, or {kind:'dismiss', ids} when she closes alerts
async function sealSend(fields, bytes) {
  const ib = D.inbox, tid = await teacherId(sessionCode);
  const pub = await crypto.subtle.importKey('spki', b64(ib.pub), { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['encrypt']);
  const raw = crypto.getRandomValues(new Uint8Array(32)), iv = crypto.getRandomValues(new Uint8Array(12));
  const meta = utf8.encode(JSON.stringify({ tid, ...fields, at: new Date().toISOString() }));
  const body = new Uint8Array(4 + meta.length + bytes.length);
  new DataView(body.buffer).setUint32(0, meta.length); body.set(meta, 4); body.set(bytes, 4 + meta.length);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt']), body));
  const wk = new Uint8Array(await crypto.subtle.encrypt({ name: 'RSA-OAEP' }, pub, raw));
  const blob = new Uint8Array(18 + wk.length + ct.length);   // 'WKI1' | u16 len | wrapped key | iv | ciphertext
  blob.set(utf8.encode('WKI1')); new DataView(blob.buffer).setUint16(4, wk.length); blob.set(wk, 6); blob.set(iv, 6 + wk.length); blob.set(ct, 18 + wk.length);
  const p = `in/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.bin`;
  const r = await fetch(`https://api.github.com/repos/${ib.repo}/contents/${p}`, { method: 'PUT',
    headers: { Authorization: 'Bearer ' + ib.token, Accept: 'application/vnd.github+json' },
    body: JSON.stringify({ message: 'upload', branch: ib.branch, content: toB64(blob) }) });
  if (!r.ok) throw new Error('gh' + r.status);
}
function renderPending(t) {

  const loose = n => n.toLowerCase().replace(/ \(\d+\)(?=\.[^.]+$)/, '').replace(/[\\/:*?"<>|]/g, ' ').replace(/\s+/g, ' ').trim();
  const have = new Set(filesOf(t).concat(D.plan.flatMap(p => p.ev?.files || []), D.extra.flatMap(x => x.files || [])).map(x => loose(x.n.split(' / ').pop())));
  const all = pendGet(), now = Date.now();
  // drop entries that reached OneDrive (same name now listed) or are older than 3 days
  const keep = all.filter(p => p.to !== t.name || (!have.has(loose(p.n)) && now - p.at < 3 * 864e5));
  if (keep.length !== all.length) pendSet(keep);
  const mine = keep.filter(p => p.to === t.name);

function bindUpload(box, t) {
  let files = [];
  const list = box.querySelector('#upList'), go = box.querySelector('#upGo'), inp = box.querySelector('#upI');
  const draw = () => {
    list.innerHTML = files.map((f, k) => `<div class="up-f" data-k="${k}"><span class="ext">${esc((f.name.split('.').pop() || '').slice(0, 4))}</span>
      <span class="n">${esc(f.name)} <span class="muted">· ${kb(f.size)}</span>${f.err ? ` <span class="warn">${esc(f.err)}</span>` : ''}</span>
      <span class="st">${f.st === 'ok' ? '<span class="chip s-ok">✓ تم</span>' : f.st === 'up' ? '<span class="chip s-na">جارٍ الرفع…</span>' : f.st === 'fail' ? '<span class="chip s-none">لم يُرفع</span>' : `<button class="note-del" data-rm="${k}">إزالة</button>`}</span></div>`).join('');
    list.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => { files.splice(+b.dataset.rm, 1); draw(); }));
    const ready = files.filter(f => !f.st && !f.err).length;
    go.hidden = !files.some(f => !f.st); go.disabled = !ready; go.textContent = ready > 1 ? `رفع ${nf(ready)} ملفات` : 'رفع';
  };
  inp.addEventListener('change', () => {
    for (const f of inp.files) {
      f.err = !UP_EXT.test(f.name) ? 'نوع غير مدعوم' : f.size > UP_MAX ? 'أكبر من 20 م.ب' : !f.size ? 'ملف فارغ' : '';
      files.push(f);
    }
    inp.value = ''; draw();
  });
  go.addEventListener('click', async () => {
    // "f:<folder index>" = one of her folders, "p:<program index>" = a program's «الشواهد» (sent as the teacher assigned to it)
    const [kind, ix] = box.querySelector('#upF').value.split(':');
    const x = kind === 'x' && D.extra[+ix], p = kind === 'p' && D.plan[+ix], c = !p && !x && D.folders[+ix];
    const who = p ? D.teachers.find(x => p.people.some(y => y.t === x.name)) || t : t;
    const key = x ? 'w:' + x.rel : p ? 'plan:' + p.name : c.key, label = x ? x.title : p ? 'برنامج ' + p.name : c.label;
    go.disabled = true; box.querySelector('#upF').disabled = true;
    let ok = 0;
    for (const f of files.filter(f => !f.st && !f.err)) {
      f.st = 'up'; draw();
      try {
        await sealUpload(f, key, who); f.st = 'ok'; ok++;
        pendSet([...pendGet(), { to: t.name, n: f.name, f: label, at: Date.now() }]);
      } catch (e) { f.st = 'fail'; f.err = e.message === 'gh401' || e.message === 'gh403' ? 'الرفع غير متاح حاليًا' : 'تحقّقي من الاتصال'; }
      draw();
    }
    box.querySelector('#upF').disabled = false;
    if (ok) { toast(`تم استلام ${ok > 1 ? nf(ok) + ' ملفات' : 'الملف'}، وسيُنقل إلى ${p ? 'مجلد الشواهد' : 'مجلدك'} قريبًا`); renderPending(t); files = files.filter(f => f.st !== 'ok'); setTimeout(draw, 1500); }
  });
  renderPending(t);
}

// --- the وكيلة: delete evidence. The request (encrypted with her passcode) goes to data/del/; the PC moves the file
// to «محذوفات» and alerts the program's teachers (tools/inbox.js), at the next run.
const DEL_REASONS = ['شاهد مكرر', 'غير مرتبط بالبرنامج', 'غير واضح أو تالف', 'أُرفق في برنامج خاطئ', 'أخرى'];
let delReqs = null;   // pending requests [{sha, path, req}] (null = not loaded yet)
async function loadDelReqs() {
  const r = await ghApi(`data/del?ref=${D.gh.branch}&t=${Date.now()}`);
  if (r.status === 404) return [];
  if (!r.ok) throw new Error('gh' + r.status);
  const out = [];
  for (const it of (await r.json()).filter(x => x.type === 'file' && x.name.endsWith('.json'))) {
    const f = await ghApi(`${it.path}?ref=${D.gh.branch}`); if (!f.ok) continue;
    try { out.push({ sha: it.sha, path: it.path, req: await openBox(JSON.parse(new TextDecoder().decode(b64((await f.json()).content.replace(/\s/g, '')))), sessionCode) }); } catch {}
  }
  return out.sort((a, b) => b.req.at.localeCompare(a.req.at));
}
function planDel(a) {
  const P = D.plan.filter(p => p.n);
  if (!D.gh) return '<div class="empty card">الحذف من المنصة يحتاج ربطها بـ GitHub (keys/github.token)</div>';
  const k = a !== undefined && a !== '' && D.plan[+a]?.n ? +a : P[0]?.k;
  const p = D.plan[k];
  return `<h2>حذف شواهد برامج الخطة التشغيلية</h2>
  <p class="muted" style="margin-top:-4px">يُنقل الملف إلى مجلد «محذوفات» (يمكن استرجاعه)، وتصل معلمات البرنامج رسالة بالحذف وسببه. يُنفَّذ الطلب عند التحديث التالي في جهاز المدرسة.</p>
  ${P.length ? `<div class="card pad" id="pdel" data-k="${k}">
    <label class="up-l">البرنامج</label>
    <select class="search" id="pdP">${P.map(x => `<option value="${x.k}"${x.k === k ? ' selected' : ''}>${esc(x.name)} — ${nf(x.n)} شاهد</option>`).join('')}</select>
    <div style="font-weight:600;margin:14px 0 4px">اختاري الشواهد المراد حذفها</div>${people(p)}
    <div class="card" style="margin-top:8px" id="pdFiles">${p.ev.files.map((x, j) => `<label class="ck" data-n="${esc(x.n)}"><input type="checkbox" value="${j}"><span class="ext">${esc(x.x || '—')}</span><span class="n">${esc(x.n)}</span><span class="d muted" style="direction:ltr">${esc(x.d)}</span></label>`).join('')}</div>
    <label class="up-l" style="margin-top:14px">سبب الحذف (يظهر للمعلمة)</label>
    <select class="search" id="pdR"><option value="">— اختاري السبب —</option>${DEL_REASONS.map(r => `<option>${r}</option>`).join('')}</select>
    <textarea class="msg note-in" id="pdT" rows="2" placeholder="توضيح للمعلمة (مطلوب عند اختيار «أخرى»)" style="width:100%;margin-top:8px"></textarea>
    <button class="btn wide" id="pdGo" style="margin-top:12px" disabled>حذف المحدد وإرسال تنبيه للمعلمة</button></div>`
    : '<div class="empty card">لا توجد شواهد مرفوعة في أي برنامج بعد</div>'}
  <h2>طلبات بانتظار التنفيذ</h2><div id="pdReqs"><div class="muted">جارٍ التحميل…</div></div>`;
}
function bindPlanDel(box) {
  const p = D.plan[+box.dataset.k], btn = box.querySelector('#pdGo'), R = box.querySelector('#pdR'), T = box.querySelector('#pdT');
  box.querySelector('#pdP').addEventListener('change', e => go('pdel/' + e.target.value));
  const picked = () => [...box.querySelectorAll('#pdFiles input:checked')].map(x => p.ev.files[+x.value].n);
  const reason = () => R.value === 'أخرى' ? T.value.trim() : [R.value, T.value.trim()].filter(Boolean).join(' — ');
  const check = () => { btn.disabled = !picked().length || !R.value || (R.value === 'أخرى' && !T.value.trim()); delete btn.dataset.sure;
    btn.textContent = picked().length > 1 ? `حذف ${nf(picked().length)} شواهد وإرسال تنبيه` : 'حذف المحدد وإرسال تنبيه للمعلمة'; };
  box.addEventListener('change', check); T.addEventListener('input', check);
  btn.addEventListener('click', async () => {
    if (btn.dataset.sure !== '1') { btn.dataset.sure = '1'; btn.textContent = `تأكيد: نقل ${nf(picked().length)} ملف إلى «محذوفات»`; btn.classList.add('danger'); return; }
    btn.disabled = true; btn.textContent = 'جارٍ الإرسال…';
    try {
      const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const req = { id, at: new Date().toISOString(), program: p.name, files: picked(), reason: reason() };
      const r = await ghApi(`data/del/${id}.json`, { method: 'PUT', body: JSON.stringify({ message: 'طلب', branch: D.gh.branch,
        content: toB64(utf8.encode(JSON.stringify(await sealBox(req, sessionCode)))) }) });
      if (!r.ok) throw new Error('gh' + r.status);
      toast('سُجّل طلب الحذف، ويُنفَّذ عند التحديث التالي'); delReqs = null; route();
    } catch (e) { toast(e.message === 'gh401' || e.message === 'gh403' ? 'رمز GitHub غير صالح أو منتهي' : 'تعذّر الإرسال، حاولي مرة أخرى'); check(); }
  });
  showDelReqs();
}
async function showDelReqs() {
  const box = $('#pdReqs'); if (!box) return;
  try { delReqs = await loadDelReqs(); } catch { box.innerHTML = '<div class="warn">تعذّر تحميل الطلبات.</div>'; return; }
  if (!$('#pdReqs')) return;
  // files already requested can't be picked again
  const pend = new Set(delReqs.flatMap(x => x.req.files.map(n => x.req.program + '|' + n))), k = $('#pdel')?.dataset.k;
  document.querySelectorAll('#pdFiles .ck').forEach(l => { if (pend.has(D.plan[+k].name + '|' + l.dataset.n)) { l.classList.add('pend'); l.querySelector('input').disabled = true; l.querySelector('.n').insertAdjacentHTML('beforeend', ' <span class="warn">بانتظار الحذف</span>'); } });
  box.innerHTML = delReqs.length ? `<div class="notes">${delReqs.map((x, j) => `<div class="note"><div class="note-h"><span>${esc(whenTxt(x.req.at))} · «${esc(x.req.program)}»</span>
      <button class="note-del" data-cancel="${j}">إلغاء الطلب</button></div><div class="note-b">${x.req.files.map(n => '• ' + esc(n)).join('<br>')}<br><span class="muted">السبب: ${esc(x.req.reason)}</span></div></div>`).join('')}</div>`
    : '<div class="muted">لا توجد طلبات معلّقة.</div>';
  box.querySelectorAll('[data-cancel]').forEach(b => b.addEventListener('click', async () => {
    if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'تأكيد الإلغاء'; b.classList.add('sure'); return; }
    b.disabled = true; const x = delReqs[+b.dataset.cancel];
    const r = await ghApi(x.path, { method: 'DELETE', body: JSON.stringify({ message: 'إلغاء', branch: D.gh.branch, sha: x.sha }) });
    toast(r.ok ? 'أُلغي الطلب' : 'تعذّر الإلغاء (ربما نُفّذ)'); route();
  }));
}

function dash() {
  const T = D.teachers, all = T.flatMap(t => t.cells.filter(c => c.s !== 'na'));
  const pct = all.length ? Math.round(all.filter(c => c.s === 'ok').length / all.length * 100) : 0;
  const full = T.filter(t => t.exist && t.done === t.exist).length;
  const allFiles = T.flatMap(filesOf), wk = weekly(allFiles), cw = wk.length;
  const activeNow = T.filter(t => filesOf(t).some(x => weekOf(x.d) === cw)).length;

  const bands = [['أكملت كل المجلدات', t => t.pct === 100, 'var(--ok)'], ['من 80 إلى 99', t => t.pct >= 80 && t.pct < 100, 'var(--ok)'],
    ['من 50 إلى 79', t => t.pct >= 50 && t.pct < 80, '#e0a526'], ['أقل من 50', t => t.pct < 50, 'var(--none)']].map(([l, f, c]) => [l, T.filter(f).length, c]);
  const bmax = Math.max(1, ...bands.map(b => b[1]));
  const ranked = [...T].sort((a, b) => b.pct - a.pct || b.total - a.total);
  const adm = D.admins.filter(a => a.count >= D.adminMin).length;
  return `
  <div class="card hero">${ring(pct).replace('class="ring"', 'class="ring lg"')}
    <div class="grow"><h2>لوحة المؤشرات · ${esc(D.week)}</h2>

  <div class="kpis">
    <div class="card kpi"><b style="color:${pctColor(pct)}">${nf(pct)}%</b><span>إنجاز المجلدات في المدرسة</span></div>
    <div class="card kpi"><b>${nf(wk[cw - 1] || 0)}</b><span>ملفًا رُفع هذا الأسبوع</span></div>
    <div class="card kpi"><b>${nf(activeNow)} / ${nf(T.length)}</b><span>معلمات نشطات هذا الأسبوع</span></div>
    <div class="card kpi"><b style="color:${idle.length ? 'var(--none)' : 'inherit'}">${nf(idle.length)}</b><span>بلا رفع منذ أكثر من 7 أيام</span></div>
  </div>
  <div class="dgrid">
    <div class="card pad dcard"><h3>نشاط الرفع في المدرسة</h3><div class="muted">مجموع ملفات المعلمات في كل أسبوع دراسي</div>${weekChart(wk)}</div>
    <div class="card pad dcard"><h3>توزيع المعلمات حسب الإنجاز</h3><div class="muted">عدد المعلمات حسب نسبة الإنجاز (٪)</div>
      <div class="bars" style="margin-top:10px">${bands.map(([l, n, c]) => `<div class="bar-row" style="cursor:default" data-tip="${esc(l)}: ${nf(n)} معلمة"><span>${esc(l)}</span>
        <span class="track"><i style="width:${n / bmax * 100}%;background:${c};border-radius:6px"></i></span><span class="pct">${nf(n)}</span></div>`).join('')}</div>
      <div class="muted" style="margin-top:10px">مبادرات الإداريات: ${nf(adm)} من ${nf(D.admins.length)} مكتملة</div></div>
  </div>
  <div class="dgrid">
    <div class="card pad dcard"><h3>ترتيب المعلمات</h3><div class="muted">نسبة المجلدات المكتملة · اضغطي الاسم لصفحتها</div>
      <div class="rank">${ranked.map(t => `<button class="bar-row" data-go="t/${t.i}"><span>${esc(t.short)}</span>
        <span class="track"><i style="width:${t.pct}%;background:${pctColor(t.pct)};border-radius:6px"></i></span><span class="pct">${nf(t.pct)}%</span></button>`).join('')}</div></div>
    <div class="card pad dcard"><h3>بحاجة إلى متابعة</h3><div class="muted">لم ترفع منذ أكثر من 7 أيام</div>
      ${idle.length ? `<div class="list" style="margin-top:10px">${idle.map(teacherRow).join('')}</div>` : '<div class="empty">جميع المعلمات رفعن خلال الأسبوع</div>'}</div>
  </div>`;
}

  <div class="card">${flags.length ? `<ul class="files">${flags.map(r => r.loose
    ? `<li><span class="ext">!</span><span class="n"><b>${esc(r.t.short)}</b> · ${nf(r.loose)} ملف في «المجتمع المهني» غير موزّع على المجلدات الفرعية</span></li>`
    : `<li><span class="ext">${esc(r.x.x)}</span><span class="n"><b>${esc(r.t.short)}</b> · ${esc(r.c.f.label)} · ${esc(r.x.n)} <span class="warn">(${esc(r.x.f.join('، '))})</span></span></li>`).join('')}</ul>` : '<div class="empty">لا توجد ملاحظات</div>'}</div>
  <h2>رسائل التذكير (${nf(msgs.length)})</h2>
  <p class="muted" style="margin-top:-4px">رسالة جاهزة لكل معلمة لديها مجلدات ناقصة — افتحي صفحتها للنسخ أو الإرسال.</p>
  <div class="list">${msgs.map(teacherRow).join('')}</div>`;
}

function admins() {
  const A = D.admins || [];
  if (!A.length) return '<div class="empty">لا توجد مجلدات للإداريات</div>';
  return `<h2>مبادرات الإداريات <span class="muted" style="font-weight:400">· المطلوب ${nf(D.adminMin)} لكل إدارية</span></h2>
  <div class="list">${A.map((a, i) => { const s = status(a, D.adminMin); return `<details class="fold"><summary><div class="grow"><div class="t">${esc(a.name)}</div><div class="g">${nf(a.count)} ملف${a.last ? ' · آخر رفع ' + esc(a.last) : ''}</div></div>${chip(s)}</summary>
    ${a.files.length ? `<ul class="files">${a.files.map(fileLi).join('')}</ul>` : '<div class="empty">المجلد فارغ</div>'}
    <div class="acts"><a class="btn sm ghost" href="${esc(a.url)}" target="_blank" rel="noopener">فتح المجلد في OneDrive</a></div></details>`; }).join('')}</div>`;
}

/* ---------- chart tooltip (hover, or tap on phones) ---------- */
const tip = Object.assign(document.createElement('div'), { id: 'tip', hidden: true }); document.body.append(tip);
document.addEventListener('pointerover', e => {
  const x = e.target.closest('[data-tip]'); if (!x) { tip.hidden = true; return; }
  const r = x.getBoundingClientRect(); tip.textContent = x.dataset.tip; tip.hidden = false;
  tip.style.left = Math.min(innerWidth - tip.offsetWidth / 2 - 8, Math.max(tip.offsetWidth / 2 + 8, r.left + r.width / 2)) + 'px';
  tip.style.top = Math.max(tip.offsetHeight + 8, r.top - 6) + 'px';
});
addEventListener('scroll', () => tip.hidden = true, { passive: true });

/* ---------- start ---------- */
const saved = store.get();
if (saved) { $('#code').value = saved; unlock(saved, true); }
</script>
</body>
