<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f6b63">
<title>رسالة المناسبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8f4;--card:#fff;--ink:#22302d;--muted:#56645f;--line:#d9e2de;--soft:#edf4f1;--brand:#0f6b63;--accent:#b7791f;--on:#fff;--ok:#1e7f4f;--err:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#161d1b;--card:#1f2826;--ink:#e8efec;--muted:#a9b8b3;--line:#33403c;--soft:#26312e;--brand:#5fc2b5;--accent:#e2b25c;--on:#10201d;--ok:#5fd39a;--err:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif}
header{background:var(--brand);color:var(--on);padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 20px;text-align:center}
header small{display:block;opacity:.9;font-size:13px}
header h1{margin:4px 0 2px;font-size:20px}
header .hp{display:inline-block;margin-top:10px;padding:6px 18px;border-radius:999px;background:rgba(255,255,255,.2);font-weight:700;font-size:17px}
main{max-width:640px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.muted{color:var(--muted);font-size:14px}
.lbl{display:block;font-weight:700;margin:0 0 8px}
.lbl span{font-weight:400;color:var(--muted);font-size:13px}
.prompt{font-size:17px;font-weight:600;margin:0;border-inline-start:4px solid var(--accent);padding-inline-start:10px}
.cls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cls button{font:inherit;font-size:14px;color:inherit;cursor:pointer;border:1.5px solid var(--line);background:var(--soft);border-radius:12px;padding:10px 4px;font-weight:600;min-height:44px}
.cls button.on{border-color:var(--brand);background:var(--brand);color:var(--on)}
input,textarea{width:100%;font:inherit;color:inherit;background:var(--soft);border:1.5px solid var(--line);border-radius:12px;padding:12px}
input:focus,textarea:focus{outline:none;border-color:var(--brand)}
textarea{min-height:190px;resize:vertical;line-height:1.8}
.cnt{text-align:left;font-size:12px;color:var(--muted);margin-top:4px}
.miss{border-color:var(--err)!important}
.btn{display:block;width:100%;font:inherit;font-weight:700;font-size:17px;border:0;border-radius:14px;padding:14px;background:var(--brand);color:var(--on);cursor:pointer}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand);margin-top:14px}
.btn:disabled{opacity:.55;cursor:wait}
.err{color:var(--err);font-size:14px;text-align:center;min-height:22px;margin-top:8px}
.done{text-align:center;padding:36px 16px}
.done .ic{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto 12px;font-size:32px}
[hidden]{display:none!important}
/* ألوان المناسبة: يوم المعلم = هوية اليوم (أخضر #55AA5C، بنفسجي #281959، كحلي #00234E، أصفر #FFCB05 ودرجاتها الفاتحة) */
body.t-o2{--bg:#F1F7F1;--card:#fff;--line:#C9E3CB;--soft:#F7FBF7;--ink:#00234E;--muted:#4A5C78;--brand:#281959;--accent:#55AA5C;--on:#fff;--ok:#55AA5C}
body.t-o2 header{background:#fff;color:#00234E;border-bottom:6px solid #FFCB05;box-shadow:inset 0 -6px 0 #55AA5C;padding-bottom:22px}
body.t-o2 header small{color:#4A5C78}body.t-o2 header h1,body.t-o2 header .hp{display:none}
.logo{display:block;width:min(230px,62vw);height:auto;margin:10px auto 0}
body.t-o2 .btn:not(.ghost){background:#55AA5C;color:#00234E}
body.t-o2 .btn.ghost{color:#281959;border-color:#281959}
body.t-o2 .prompt{border-color:#55AA5C}
body.t-o2 .cls button.on{background:#281959;border-color:#281959;color:#fff}
body.t-o2 input:focus,body.t-o2 textarea:focus{border-color:#281959}
@media (prefers-color-scheme:dark){body.t-o2{--bg:#001631;--card:#0B2547;--soft:#12305A;--line:#24406A;--ink:#EEF2F8;--muted:#B7C2D3;--ok:#6CC173}
  body.t-o2 .btn.ghost{color:#C3BFD6;border-color:#C3BFD6}body.t-o2 .cls button.on{background:#FFCB05;border-color:#FFCB05;color:#00234E}body.t-o2 input:focus,body.t-o2 textarea:focus{border-color:#FFCB05}}
</style>
</head>
<body>
<header>
  <small>المتوسطة الحادية والعشرون · النشاط الطلابي</small>
  <h1>الأيام والمناسبات</h1>
  <div class="hp" id="hprog" hidden></div>
  <img class="logo" id="logo" alt="" hidden>
</header>
<main>
  <div id="load" class="card muted">جارٍ التحميل…</div>
  <div id="bad" class="card" hidden><b id="badT">الرابط غير صحيح.</b><div class="muted">اطلبي الرابط من رائدة النشاط.</div></div>
  <form id="f" hidden novalidate>
    <div class="card"><p class="prompt" id="prompt"></p><div class="muted" style="margin-top:8px">رسالتك تصل إلى رائدة النشاط، وقد تُختار لتُقرأ في الإذاعة المدرسية أو تُعرض في لوحة المناسبة.</div></div>
    <div class="card" id="clsBox"><span class="lbl">فصلك</span><div class="cls" id="cls"></div></div>
    <div class="card"><label class="lbl" for="nm">اسمك <span>(اختياري)</span></label><input id="nm" maxlength="60" autocomplete="name"></div>
    <div class="card" id="msgBox"><label class="lbl" for="msg">رسالتك</label><textarea id="msg" maxlength="1500" placeholder="اكتبي رسالتك هنا…"></textarea><div class="cnt" id="cnt">٠ / ١٥٠٠</div></div>
    <button class="btn" id="send">إرسال الرسالة</button>
    <div class="err" id="err"></div>
  </form>
  <div id="ok" class="card done" hidden><div class="ic">✓</div><h2 style="margin:0 0 6px">شكرًا لك</h2><div class="muted">وصلت رسالتك إلى رائدة النشاط.</div>
    <button class="btn ghost" id="again" type="button">كتابة رسالة أخرى</button></div>
</main>
<script>
'use strict';
const API = 'https://script.google.com/macros/s/AKfycbxVTMH2PAr_rFkgfx3U1jdYHZLkYX0wn_DP4CvtRrUJdnVmnLsujX1x0NCwlPW9Rm7EkQ/exec';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ar = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const o = new URLSearchParams(location.search).get('o') || '';
const ls = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
let dev = ls.get('srv-dev'); if (!dev) { dev = Array.from(crypto.getRandomValues(new Uint8Array(9)), b => b.toString(16).padStart(2, '0')).join(''); ls.set('srv-dev', dev); }
let cls = ls.get('oc-cls') || '';
const THEME = { o2: { color: '#00234E', logo: 'teacher-day.png', alt: 'شعار يوم المعلم' } };   // ألوان وشعار خاصة لبعض المناسبات (CSS body.t-<id>)
if (THEME[o]) { document.body.classList.add('t-' + o); document.querySelector('meta[name=theme-color]').content = THEME[o].color;
  if (THEME[o].logo) { const l = $('#logo'); l.src = THEME[o].logo; l.alt = THEME[o].alt; l.hidden = false; } }

function show(id) { ['load', 'bad', 'f', 'ok'].forEach(x => $('#' + x).hidden = x !== id); }

async function init() {
  if (!/^o\d+$/.test(o)) return show('bad');
  let info;
  try { info = await (await fetch(`${API}?op=ct&a=oinfo&o=${o}`)).json(); } catch { info = null; }
  if (!info || !info.ok) return show('bad');
  $('#hprog').textContent = info.name; $('#hprog').hidden = false; document.title = 'رسالة ' + info.name;
  if (!info.open) { $('#badT').textContent = 'استقبال الرسائل لهذه المناسبة مغلق الآن.'; return show('bad'); }
  $('#prompt').textContent = info.prompt || 'اكتبي رسالتك بمناسبة ' + info.name;
  if (info.classes.indexOf(cls) < 0) cls = '';
  $('#cls').innerHTML = info.classes.map(c => `<button type="button" data-c="${esc(c)}"${c === cls ? ' class="on"' : ''}>${esc(c)}</button>`).join('');
  $('#cls').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; cls = b.dataset.c; ls.set('oc-cls', cls);
    $('#cls').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); $('#clsBox').classList.remove('miss'); });
  $('#nm').value = ls.get('oc-nm') || '';
  show('f');
}
$('#msg').addEventListener('input', () => { $('#cnt').textContent = ar($('#msg').value.length) + ' / ١٥٠٠'; $('#msgBox').classList.remove('miss'); });

$('#f').addEventListener('submit', async e => {
  e.preventDefault(); $('#err').textContent = '';
  const msg = $('#msg').value.trim(), nm = $('#nm').value.trim();
  if (!cls) { $('#clsBox').classList.add('miss'); $('#err').textContent = 'اختاري فصلك'; $('#clsBox').scrollIntoView({ behavior: 'smooth' }); return; }
  if (msg.length < 3) { $('#msgBox').classList.add('miss'); $('#err').textContent = 'اكتبي رسالتك أولًا'; $('#msg').focus(); return; }
  ls.set('oc-nm', nm);
  const btn = $('#send'); btn.disabled = true; btn.textContent = 'جارٍ الإرسال…';
  const body = JSON.stringify({ a: 'omsg', o, cls, nm, msg, dev });
  try {
    let r, last;
    for (let i = 0; i < 3 && !r; i++) {   // خادم Google يفشل أحيانًا في المحاولة الأولى؛ التكرار لا يكرر الرسالة
      try { r = await (await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body })).json(); }
      catch (x) { last = x; await new Promise(z => setTimeout(z, 900)); }
    }
    if (!r) throw last;
    if (!r.ok) { $('#err').textContent = r.error || 'تعذّر الإرسال'; btn.disabled = false; btn.textContent = 'إرسال الرسالة'; return; }
    $('#msg').value = ''; $('#cnt').textContent = '٠ / ١٥٠٠'; show('ok'); window.scrollTo(0, 0);
  } catch { $('#err').textContent = 'تعذّر الإرسال، تحققي من الاتصال وحاولي مرة أخرى'; }
  btn.disabled = false; btn.textContent = 'إرسال الرسالة';
});
$('#again').addEventListener('click', () => { show('f'); $('#msg').focus(); });
init();
</script>
</body>
</html>
