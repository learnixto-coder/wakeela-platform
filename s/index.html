<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#6b5d82">
<title>استبانة قياس أثر البرنامج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fefaef;--card:#fff;--ink:#2a2c33;--muted:#5c6168;--line:#dde3e2;--soft:#eef4f4;--brand:#6b5d82;--brand-2:#56706c;--on:#fff;--ok:#1e7f4f;--err:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1b1c22;--card:#24252d;--ink:#eceef2;--muted:#b0b4bc;--line:#363844;--soft:#2c2e37;--brand:#a599b5;--brand-2:#acbdba;--on:#1b1c22;--ok:#5fd39a;--err:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif}
header{background:var(--brand);color:var(--on);padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 18px;text-align:center}
header small{display:block;opacity:.9;font-size:13px}
header h1{margin:4px 0 2px;font-size:19px}
header .hp{display:inline-block;margin-top:10px;padding:6px 16px;border-radius:999px;background:rgba(255,255,255,.18);font-weight:700;font-size:16px}
main{max-width:640px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.prog{font-size:18px;font-weight:700;margin:0}
.muted{color:var(--muted);font-size:14px}
.types{display:flex;gap:8px;margin-top:10px}
.types button,.opt{font:inherit;color:inherit;cursor:pointer;border:1.5px solid var(--line);background:var(--soft);border-radius:12px}
.types button{flex:1;padding:10px;font-weight:600}
.types button.on,.opt.on{border-color:var(--brand);background:var(--brand);color:var(--on)}
.q{scroll-margin-top:12px}
.q.miss{border-color:var(--err)}
.q-t{display:flex;gap:10px;font-weight:600;margin-bottom:10px}
.q-n{flex:0 0 28px;height:28px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:14px;color:var(--brand-2)}
.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.opt{padding:8px 2px;font-size:12.5px;line-height:1.35;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.opt b{font-size:15px}
@media (max-width:420px){.opts{grid-template-columns:1fr}.opt{flex-direction:row;justify-content:flex-start;gap:10px;padding:10px 12px;min-height:0;font-size:14px}.opt b{width:20px}}
.btn{display:block;width:100%;font:inherit;font-weight:700;font-size:17px;border:0;border-radius:14px;padding:14px;background:var(--brand);color:var(--on);cursor:pointer}
.btn:disabled{opacity:.55;cursor:wait}
.err{color:var(--err);font-size:14px;text-align:center;min-height:22px;margin-top:8px}
.done{text-align:center;padding:36px 16px}
.done .ic{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto 12px;font-size:32px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <small>المتوسطة الحادية والعشرون</small>
  <h1>استبانة قياس أثر البرامج</h1>
  <div class="hp" id="hprog" hidden></div>
</header>
<main>
  <div id="load" class="card muted">جارٍ التحميل…</div>
  <div id="bad" class="card" hidden><b>الرابط غير صحيح أو أن الاستبانة مغلقة.</b><div class="muted">اطلبي الرابط من معلمة البرنامج.</div></div>
  <form id="f" hidden>
    <div class="card">
      <div class="muted">إجابتك سرّية ولا يُطلب اسمك.</div>
      <div id="tbox" hidden><div class="muted" style="margin-top:12px">أنا:</div><div class="types" id="types"></div></div>
      <div class="muted" style="margin-top:12px">ضعي اختيارك أمام درجة الموافقة المناسبة لكل عبارة.</div>
    </div>
    <div id="qs"></div>
    <button class="btn" id="send">إرسال</button>
    <div class="err" id="err"></div>
  </form>
  <div id="ok" class="card done" hidden><div class="ic">✓</div><h2 style="margin:0 0 6px">شكرًا لك</h2><div class="muted" id="okMsg">وصلت إجابتك، ورأيك يساعدنا على تحسين البرنامج.</div></div>
</main>
<script>
'use strict';
const API = 'https://script.google.com/macros/s/AKfycbzx13vLUF31MrEScmb-JsdrOs78cIpZEf4TucFH5dLTW9SmdrTFVIp9XwBRFfVzjMLQ/exec';
const ITEMS = ['حقق البرنامج أهدافه المخطط لها.', 'أسهم البرنامج في تنمية معارفي ومهاراتي.', 'كانت أنشطة البرنامج مناسبة ومنظمة.',
  'أظهر البرنامج أثرًا إيجابيًا ملموسًا.', 'أنا راضية عن البرنامج وأوصي باستمراره.'];
const SCALE = [[5, 'أوافق بشدة'], [4, 'أوافق'], [3, 'محايد'], [2, 'لا أوافق'], [1, 'لا أوافق بشدة']];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ar = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const p = new URLSearchParams(location.search).get('p') || '';
const ls = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
let dev = ls.get('srv-dev'); if (!dev) { dev = Array.from(crypto.getRandomValues(new Uint8Array(9)), b => b.toString(16).padStart(2, '0')).join(''); ls.set('srv-dev', dev); }
const ans = Array(ITEMS.length).fill(0);
let type = '';

function show(id) { ['load', 'bad', 'f', 'ok'].forEach(x => $('#' + x).hidden = x !== id); }

async function init() {
  if (!/^\d+$/.test(p)) return show('bad');
  if (ls.get('srv-done-' + p)) { $('#okMsg').textContent = 'سبق أن أرسلتِ إجابتك على هذه الاستبانة من هذا الجهاز. شكرًا لك.'; return show('ok'); }
  let info;
  try { info = await (await fetch(`${API}?a=info&p=${p}`)).json(); } catch { info = null; }
  if (!info || !info.ok) return show('bad');
  $('#hprog').textContent = info.name; $('#hprog').hidden = false;
  if (info.types.length === 1) type = info.types[0];
  else {
    $('#tbox').hidden = false;
    $('#types').innerHTML = info.types.map(t => `<button type="button" data-t="${esc(t)}">${esc(t)}</button>`).join('');
    $('#types').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; type = b.dataset.t;
      $('#types').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); });
  }
  $('#qs').innerHTML = ITEMS.map((t, i) => `<div class="card q" id="q${i}"><div class="q-t"><span class="q-n">${ar(i + 1)}</span><span>${esc(t)}</span></div>
    <div class="opts" role="radiogroup" aria-label="${esc(t)}">${SCALE.map(([v, l]) => `<button type="button" class="opt" role="radio" aria-checked="false" data-i="${i}" data-v="${v}"><b>${ar(v)}</b>${l}</button>`).join('')}</div></div>`).join('');
  $('#qs').addEventListener('click', e => {
    const b = e.target.closest('.opt'); if (!b) return;
    const i = +b.dataset.i; ans[i] = +b.dataset.v;
    b.parentNode.querySelectorAll('.opt').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-checked', x === b); });
    $('#q' + i).classList.remove('miss');
  });
  show('f');
}

$('#f').addEventListener('submit', async e => {
  e.preventDefault(); $('#err').textContent = '';
  if (!type) { $('#err').textContent = 'اختاري الفئة أولًا'; $('#tbox').scrollIntoView({ behavior: 'smooth' }); return; }
  const miss = ans.findIndex(v => !v);
  if (miss >= 0) { ans.forEach((v, i) => $('#q' + i).classList.toggle('miss', !v)); $('#err').textContent = 'أجيبي عن جميع العبارات'; $('#q' + miss).scrollIntoView({ behavior: 'smooth' }); return; }
  const btn = $('#send'); btn.disabled = true; btn.textContent = 'جارٍ الإرسال…';
  const body = JSON.stringify({ p, type, ans, dev });
  try {
    let r;
    try { r = await (await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body })).json(); }
    catch { await fetch(API, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body }); r = { ok: true }; }
    if (!r.ok) throw new Error(r.error);
    ls.set('srv-done-' + p, '1'); show('ok'); window.scrollTo(0, 0);
  } catch { $('#err').textContent = 'تعذّر الإرسال، تحققي من الاتصال وحاولي مرة أخرى'; btn.disabled = false; btn.textContent = 'إرسال'; }
});
init();
</script>
</body>
</html>
